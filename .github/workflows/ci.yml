name: Node.js CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # -----------------------------
  # Job 1: Test Node.js
  # -----------------------------
  test:
    name: Test Node.js Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Check application
        run: node --check src/server.js

      - name: Check application files
        run: |
          test -f src/app.js
          test -f src/server.js
          test -f src/routes/health.routes.js
          test -f src/controllers/health.controller.js

  # -----------------------------
  # Job 2: Docker Build + Test
  # -----------------------------
  docker:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t devops-node-api:${{ github.sha }} .

      - name: Run Docker container
        run: |
          docker run -d \
            --name devops-node-api \
            -p 5000:5000 \
            devops-node-api:${{ github.sha }}

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/api/health; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to start"
          docker logs devops-node-api
          exit 1

      - name: Test root endpoint
        run: curl -fsS http://localhost:5000/

      - name: Test health endpoint
        run: curl -fsS http://localhost:5000/api/health

      - name: Test readiness endpoint
        run: curl -fsS http://localhost:5000/api/health/ready

      - name: Show container logs
        if: always()
        run: docker logs devops-node-api

      - name: Stop container
        if: always()
        run: |
          docker stop devops-node-api || true
          docker rm devops-node-api || true

  # -----------------------------
  # Job 3: Push to AWS ECR
  # -----------------------------
  push-to-ecr:
    name: Push Docker Image to AWS ECR
    runs-on: ubuntu-latest
    needs: docker

    # Required for GitHub OIDC
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate GitHub with AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::060795914141:role/GitHubActionsECRRole
          aws-region: ap-south-1

      # Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/devops-node-api:${{ github.sha }} .

      # Push image
      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/devops-node-api:${{ github.sha }}

      # Display image
      - name: Display image
        run: |
          echo "Docker image pushed successfully:"
          echo "${{ steps.login-ecr.outputs.registry }}/devops-node-api:${{ github.sha }}"